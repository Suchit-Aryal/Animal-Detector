<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or 'Animal Watch' }}</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="image/svg+xml">
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('live') }}">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/>
      <circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="16" cy="16" r="4" fill="#fff"/>
      <circle cx="24" cy="8" r="2.2" fill="#ffd166"/></svg>
    <span>Animal Watch</span>
  </a>
  <nav>
    <a href="{{ url_for('live') }}" class="{{ 'on' if page == 'live' }}">Live</a>
    <a href="{{ url_for('gallery_page') }}" class="{{ 'on' if page == 'gallery' }}">Gallery</a>
    <a href="{{ url_for('animals_page') }}" class="{{ 'on' if page == 'animals' }}">Animals</a>
    <a href="{{ url_for('events_page') }}" class="{{ 'on' if page == 'events' }}">Events</a>
    <a href="{{ url_for('log_page') }}" class="{{ 'on' if page == 'log' }}">Log</a>
    <a href="{{ url_for('stats_page') }}" class="{{ 'on' if page == 'stats' }}">Stats</a>
    <a href="{{ url_for('settings_page') }}" class="{{ 'on' if page == 'settings' }}">Settings</a>
  </nav>
  <button type="button" id="theme" class="ghost" aria-label="Switch dark or light theme">Theme</button>
</header>
<main>
{% block content %}{% endblock %}
</main>
<div id="lb" class="lb" hidden role="dialog" aria-label="Snapshot viewer">
  <button type="button" class="lb-x" id="lb-close" aria-label="Close">&times;</button>
  <button type="button" class="lb-nav" id="lb-prev" aria-label="Previous">&lsaquo;</button>
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  <button type="button" class="lb-nav" id="lb-next" aria-label="Next">&rsaquo;</button>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% if hosted %}<script src="{{ url_for('static', filename='camera.js') }}"></script>{% endif %}
</body>
</html>
